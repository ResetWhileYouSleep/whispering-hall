<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Threshold Opens</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{
min-height:100%;
overflow-x:hidden;
overflow-y:auto;
background:#000;
color:#f5e6d3;
font-family:Georgia, serif;
}

.hero{
position:relative;
width:100%;
height:100vh;

background:url('threshold-opens.PNG')
center center
/ cover
no-repeat;

display:flex;
align-items:center;
justify-content:center;

text-align:center;

animation:gatewayGlow 8s ease-in-out infinite;
}

@keyframes gatewayGlow{

0%{
filter:brightness(1);
}

50%{
filter:brightness(1.15);
}

100%{
filter:brightness(1);
}

}

.overlay{
position:absolute;
inset:0;

background:
linear-gradient(
to bottom,
rgba(0,0,0,.45),
rgba(0,0,0,.55),
rgba(0,0,0,.78)
);
}

.content{
position:relative;
z-index:2;

max-width:720px;

padding:40px 24px;
padding-top:18vh;
}

.logo{
font-size:.8rem;
letter-spacing:4px;
margin-bottom:24px;
opacity:.9;
}

h1{
font-size:clamp(2rem,5vw,4rem);
font-weight:400;
line-height:1.05;
margin-bottom:28px;
}

.text{
font-size:clamp(1rem,2vw,1.1rem);
line-height:1.9;
}

.star{
font-size:1.5rem;
margin:24px 0;
}

.btn{

display:inline-block;

margin-top:36px;

padding:18px 52px;

color:#f5e6d3;

text-decoration:none;

font-size:1.15rem;

letter-spacing:.5px;

background:
rgba(245,230,211,.04);

border:
1px solid
rgba(245,230,211,.35);

box-shadow:
0 0 8px rgba(245,230,211,.08),
inset 0 0 12px rgba(245,230,211,.05);

position:relative;

transition:all .4s ease;

}

.btn::before{
content:"✦";
margin-right:12px;
opacity:.8;
}

.btn::after{
content:"✦";
margin-left:12px;
opacity:.8;
}

.btn:hover{

background:
rgba(245,230,211,.08);

border-color:
rgba(245,230,211,.65);

box-shadow:
0 0 18px rgba(245,230,211,.15),
inset 0 0 16px rgba(245,230,211,.08);

}

.secondary{
margin-top:18px;
font-size:.9rem;
opacity:.6;
}

audio{
display:none;
}

@media (orientation:landscape){

.hero{
min-height:100vh;
height:auto;
padding:60px 0;
}

.content{
padding-top:80px;
padding-bottom:60px;
}

}

@media (max-width:768px){

.content{
padding-top:18vh;
}

}

</style>

</head>

<body>

<audio id="gatewayAudio" loop>
<source src="threshold-gateway.mp3" type="audio/mpeg">
</audio>

<section class="hero">

<div class="overlay"></div>

<div id="content" class="content"></div>

</section>

<script>

const destination =
'https://resetwhileyousleep.github.io/whispering-hall/';

const content =
document.getElementById(
'content'
);

const visited =
localStorage.getItem(
'thresholdVisited'
);

if(!visited){

content.innerHTML = `

<div class="logo">
THE SANCTUARY
</div>

<h1>
THE THRESHOLD OPENS
</h1>

<div class="text">

<p>
The sanctuary remembers.
</p>

<p>
The path is open.
</p>

<p>
The veil grows thin.
The chambers await.
</p>

<div class="star">
✦
</div>

<p>
Beyond this doorway lie
chambers reserved for those
who chose to continue.
</p>

<br>

<p>
Enter slowly.
</p>

<p>
There is no need to hurry.
</p>

</div>

<a
class="btn"
href="${destination}">
Enter the Inner Sanctuary
</a>

`;

localStorage.setItem(
'thresholdVisited',
'true'
);

}else{

content.innerHTML = `

<div class="logo">
THE SANCTUARY
</div>

<h1>
WELCOME BACK,
TRAVELER
</h1>

<div class="text">

<p>
The Archive recognizes
your return.
</p>

<p>
The chambers await.
</p>

<div class="star">
✦
</div>

<p>
Some doors open only once.
</p>

<p>
Others remain open for
those who remember
the way.
</p>

</div>

<a
class="btn"
href="${destination}">
Continue Your Journey
</a>

<div class="secondary">
Sanctuary Map
(Coming Soon)
</div>

`;

}

const audio =
document.getElementById(
'gatewayAudio'
);

let audioStarted = false;

function startAudio(){

if(audioStarted) return;

audioStarted = true;

audio.volume = 0;

audio.play().catch(()=>{});

let volume = 0;

const fade =
setInterval(()=>{

volume += 0.005;

if(volume >= 0.18){

volume = 0.18;

clearInterval(fade);

}

audio.volume = volume;

},200);

}

document.addEventListener(
'touchstart',
startAudio,
{once:true}
);

document.addEventListener(
'click',
startAudio,
{once:true}
);

</script>

</body>
</html>
