<!DOCTYPE html>

<head>

<title>The Threshold Opens</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{

min-height:100%;

overflow-x:hidden;
overflow-y:auto;

background:#000;

color:#f5e6d3;

font-family:
Georgia,
serif;

}

.hero{

position:relative;

width:100%;

height:100vh;

background:

url('threshold-opens.PNG')

center center

/

cover

no-repeat;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

}

.overlay{

position:absolute;

inset:0;

background:

linear-gradient(

to bottom,

rgba(0,0,0,.52),

rgba(0,0,0,.64),

rgba(0,0,0,.84)

);

z-index:0;

}

/* ===== MOON-GOLD DOORWAY GLOW ===== */

.door-glow{

position:absolute;

left:50%;
top:48%;

width:28vw;
height:38vw;

max-width:220px;
max-height:340px;

transform: translateX(-50%) scale(1, 1.4);

background: radial-gradient(
  ellipse at center,
rgba(255,240,190,0.90) 0%,
rgba(255,210,140,0.60) 35%,
rgba(255,180,100,0.25) 65%,
transparent 100%
);

mix-blend-mode:screen;

animation:

doorPulse

12s

ease-in-out

infinite;

pointer-events:none;

z-index:2;

}

@keyframes doorPulse{

0%{

opacity:.20;

transform:

translate(-50%,-50%)

scale(.92, 1.3);

}

50%{

opacity:1;

transform:

translate(-50%,-50%)

scale(1.02,1.4);

}

100%{

opacity:.20;

transform:

translate(-50%,-50%)

scale(.92,1.3);

}

}

.content{

position:relative;

z-index:3;

max-width:760px;

padding-left:30px;
padding-right:30px;

padding-top:18vh;

padding-bottom:10vh;

}

.logo{

font-size:.9rem;

letter-spacing:8px;

margin-bottom:48px;

opacity:.85;

}

h1{

font-size:

clamp(

2.5rem,

6vw,

4.6rem

);

font-weight:400;

line-height:1.18;

margin-bottom:48px;

}

.text{

font-size:

clamp(

1.05rem,

2vw,

1.2rem

);

line-height:2.2;

}

.star{

font-size:2rem;

margin:

48px

0;

opacity:.95;

}

.btn{

display:inline-block;

margin-top:50px;

padding:

18px

42px;

background:

linear-gradient(

180deg,

rgba(190,150,80,.95),

rgba(120,90,35,.95)

);

color:#fff7e8;

text-decoration:none;

font-size:1.15rem;

letter-spacing:.5px;

border:none;

border-radius:999px;

box-shadow:

0 0 12px

rgba(255,200,120,.35),

0 0 35px

rgba(255,200,120,.20),

inset 0 1px 0

rgba(255,255,255,.25);

transition:

all .4s ease;

}

.btn:hover{

transform:

translateY(-2px);

box-shadow:

0 0 18px

rgba(255,220,140,.45),

0 0 45px

rgba(255,220,140,.25);

}

.secondary{

margin-top:24px;

font-size:.9rem;

opacity:.6;

}

audio{

display:none;

}

/* ===== LANDSCAPE ===== */

@media (orientation:landscape){

.hero{

min-height:100vh;

height:auto;

padding:60px 0;

}

.content{

padding-top:80px;

padding-bottom:60px;

}

}

/* ===== MOBILE ===== */

@media (max-width:768px){

.content{

padding-top:20vh;

}

.logo{

margin-bottom:40px;

}

h1{

margin-bottom:40px;

}

}

</style>

</head>

<body>

<audio
id="gatewayAudio"
loop>

<source
src="threshold-gateway.mp3"
type="audio/mpeg">

</audio>

<section class="hero">

<div class="overlay"></div>

<div class="door-glow"></div>

<div
id="content"
class="content">

</div>

</section>

<script>

const destination =

'https://resetwhileyousleep.github.io/whispering-hall/';

const content =

document.getElementById(

'content'

);

const visited =

localStorage.getItem(

'thresholdVisited'

);

if(!visited){

content.innerHTML = `

THE SANCTUARY

</div>

<h1>

</h1>

<div class="text">

<p>

</p>

<p>

</p>

<p>

The veil grows thin.

</p>

<div class="star">

✦

</div>

<p>

<p>

</p>

class="btn"

href="${destination}">

localStorage.setItem(

'thresholdVisited',

'true'

);

}else{

content.innerHTML = `

<div class="logo">

THE SANCTUARY

</div>

<h1>

WELCOME BACK,<br>

TRAVELER

</h1>

<div class="text">

<p>

</p>

</p>

✦

</div>

</p>

<p>

</p>

</div>

<a

class="btn"

href="${destination}">

❦ Continue Your Journey ❦

</a>

<div class="secondary">

Sanctuary Map

(Coming Soon)

</div>

`;

}

const audio =

document.getElementById(

'gatewayAudio'

);

let audioStarted = false;

function startAudio(){

if(audioStarted) return;

audioStarted = true;

audio.volume = 0.08;

audio.play().catch(()=>{});

let volume = 0.08;

const fade =

setInterval(()=>{

volume += 0.01;

if(volume >= 0.45){

volume = 0.45;

clearInterval(fade);

}

audio.volume = volume;

}

document.addEventListener(

'touchstart',

startAudio,

{once:true}

);

startAudio,

{once:true}

);

</script>

</body>

</html>
