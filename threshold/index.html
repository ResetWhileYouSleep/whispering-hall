<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Threshold Opens</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;color:#f5e6d3;font-family:Georgia,serif}
.hero{position:relative;height:100vh;width:100%;background:url('threshold-opens.PNG') center center/cover no-repeat;display:flex;align-items:center;justify-content:center;text-align:center}
.overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.2),rgba(0,0,0,.45),rgba(0,0,0,.7))}
.content{position:relative;z-index:2;max-width:720px;padding:40px 24px}
.logo{font-size:.8rem;letter-spacing:4px;margin-bottom:24px}
h1{font-size:clamp(2.5rem,6vw,4.8rem);font-weight:400;margin-bottom:24px}
.text{font-size:1.1rem;line-height:1.8}
.btn{display:inline-block;margin-top:36px;padding:16px 34px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#f5e6d3;text-decoration:none}
.secondary{margin-top:18px;font-size:.9rem;opacity:.6}
audio{display:none}
</style>
</head>
<body>
<audio autoplay loop id="gatewayAudio">
<source src="threshold-gateway.mp3" type="audio/mpeg">
</audio>
<section class="hero">
<div class="overlay"></div>
<div id="content" class="content"></div>
</section>
<script>
const destination='https://resetwhileyousleep.github.io/whispering-hall/';
const content=document.getElementById('content');
const visited=localStorage.getItem('thresholdVisited');

if(!visited){
content.innerHTML=`
<div class="logo">THE SANCTUARY</div>
<h1>THE THRESHOLD OPENS</h1>
<div class="text">
<p>The sanctuary remembers.</p>
<p>The path is open.</p>
<p>The veil grows thin. The chambers await.</p>
<br><p>✦</p><br>
<p>Beyond this doorway lie the chambers reserved for those who chose to continue.</p>
<p>Enter slowly.</p>
<p>There is no need to hurry.</p>
</div>
<a class="btn" href="${destination}">Enter the Inner Sanctuary</a>`;
localStorage.setItem('thresholdVisited','true');
}else{
content.innerHTML=`
<div class="logo">THE SANCTUARY</div>
<h1>WELCOME BACK, TRAVELER</h1>
<div class="text">
<p>The Archive recognizes your return.</p>
<p>The chambers await.</p>
<br><p>✦</p><br>
<p>Some doors open only once.</p>
<p>Others remain open for those who remember the way.</p>
</div>
<a class="btn" href="${destination}">Continue Journey</a>
<div class="secondary">Sanctuary Map (Coming Soon)</div>`;
}
document.body.addEventListener('click',()=>{
document.getElementById('gatewayAudio').play();
},{once:true});
</script>
</body>
</html>
